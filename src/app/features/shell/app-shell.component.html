<div class="shell">
  <header class="shell__topbar">
    <a class="shell__brand" [routerLink]="canBacktest() ? '/backtest' : '/desk'">
      <span class="shell__logo" aria-hidden="true"><i class="pi pi-chart-line"></i></span>
      <span class="shell__brand-text">Algotrade</span>
    </a>

    <nav class="shell__nav" aria-label="Navegación principal">
      @if (canDesk()) {
        <a
          class="shell__nav-link"
          routerLink="/desk"
          routerLinkActive="shell__nav-link--active"
          ariaCurrentWhenActive="page">
          <i class="pi pi-desktop" aria-hidden="true"></i>
          <span>{{ deskLabel() }}</span>
        </a>
      } @else {
        <span class="shell__nav-link shell__nav-link--disabled" aria-disabled="true" title="Requiere perfil paper o live">
          <i class="pi pi-desktop" aria-hidden="true"></i>
          <span>{{ deskLabel() }}</span>
        </span>
      }

      @if (canBacktest()) {
        <a
          class="shell__nav-link"
          routerLink="/backtest"
          routerLinkActive="shell__nav-link--active"
          ariaCurrentWhenActive="page">
          <i class="pi pi-chart-bar" aria-hidden="true"></i>
          <span>Backtest</span>
        </a>
      } @else {
        <span class="shell__nav-link shell__nav-link--disabled" aria-disabled="true" title="Requiere perfil backtest">
          <i class="pi pi-chart-bar" aria-hidden="true"></i>
          <span>Backtest</span>
        </span>
      }
    </nav>

    <div class="shell__status">
      @if (session(); as s) {
        <span class="shell__symbol">{{ s.symbol }}</span>
        <span class="shell__interval">{{ s.interval }}</span>
      }

      <button type="button" class="shell__action" (click)="changeBackend()">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span>Cambiar backend</span>
      </button>
    </div>
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
