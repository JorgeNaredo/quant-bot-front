<div class="layout">
  <app-sidebar
    class="layout__sidebar"
    [connected]="streamsOpen()"
    [operating]="operating()"
    [accountInfo]="accountInfo()"
    [profitLocked]="profitLocked()"
    [profile]="profile()"
    [symbol]="symbol()"
    [busy]="busy()"
    [error]="error()"
    (startBot)="startBot()"
    (stopBot)="stopBot()"
    (changeBackend)="changeBackend()"
  />
  <main class="layout__main">
    <app-chart-view
      class="layout__chart"
      [breakEvenPrice]="breakEvenPrice()"
    />
    <app-dashboard-panel
      class="layout__dashboard"
      [connected]="streamsOpen()"
    />
  </main>
</div>
